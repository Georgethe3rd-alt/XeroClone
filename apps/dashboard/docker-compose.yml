version: '3.8'

services:
  dashboard:
    build: .
    container_name: openclaw-dashboard
    ports:
      - "80:80"
    environment:
      - PORT=80
      - ANTHROPIC_API_KEY=<your-api-key-here>
      - TELEGRAM_TOKEN=<your-telegram-token-here>
      - TELEGRAM_CHAT_ID=<your-chat-id-here>
      - DASH_PASSWORD=<your-password-here>
    restart: unless-stopped
    networks:
      - dashboard-net

networks:
  dashboard-net:
    driver: bridge
